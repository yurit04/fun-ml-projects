[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fun-ml-projects"
version = "0.1.0"
description = "Shared dependencies for notebooks under quant_finance/, miscellaneous/, and time_series/."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "networkx>=3.0",
    "yfinance>=0.2.0",
    "plotly>=5.18",
    "requests>=2.31",
    "lxml>=5.0",
    "cvxpy>=1.4",
    "riskfolio-lib>=6.0",
    "arch>=6.3",
    "torch>=2.0",
    "gymnasium>=0.29",
    "pygame>=2.5",           # CartPole rgb_array rendering (gymnasium[classic-control])
    "imageio>=2.30",
    "imageio-ffmpeg>=0.5",   # bundled ffmpeg for writing mp4 videos
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

# Dependency-only project (no importable package).
[tool.setuptools]
packages = []
